    l 132 0
    a 8 8 0 0 1 8 8
    l 0 140
    a 8 8 0 0 1 -8 8
    l -156 0
    a 8 8 0 0 1 -8 -8
  "/>

  <!-- Ponto inicial da espiral -->
  <circle cx="640" cy="230" r="4" fill="#7dcfff" opacity="0.9"/>

  <!-- LUMI -->
  <text x="640" y="420" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="12" fill="#7dcfff" opacity="0.85">LUMI</text>

  <!-- Tagline -->
  <text x="640" y="452" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" letter-spacing="4" fill="#565f89">LIGHTWEIGHT UNIFIED MARKUP INTERFACE</text>
</svg>
