    l 0 -8
    a 8 8 0 0 1 8 -8
    l 40 0
    a 8 8 0 0 1 8 8
    l 0 44
    a 8 8 0 0 1 -8 8
    l -60 0
    a 8 8 0 0 1 -8 -8
    l 0 -68
    a 8 8 0 0 1 8 -8
    l 84 0
    a 8 8 0 0 1 8 8
    l 0 92
    a 8 8 0 0 1 -8 8
    l -108 0
    a 8 8 0 0 1 -8 -8
    l 0 -116
  "/>

  <!-- Espiral principal -->
  <path class="spiral" d="
    M 640 230
    l 0 -8
    a 8 8 0 0 1 8 -8
    l 40 0
    a 8 8 0 0 1 8 8
    l 0 44
    a 8 8 0 0 1 -8 8
    l -60 0
    a 8 8 0 0 1 -8 -8
    l 0 -68
    a 8 8 0 0 1 8 -8
    l 84 0
    a 8 8 0 0 1 8 8
    l 0 92
    a 8 8 0 0 1 -8 8
    l -108 0
