      .spiral { fill: none; stroke: #7dcfff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .glow { fill: none; stroke: #7dcfff; stroke-width: 8; stroke-linecap: round; opacity: 0.15; }
    </style>
  </defs>

  <!-- Glow -->
  <path class="glow" d="
